<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAD182"/>
      <stop offset="50%" stop-color="#C8A251"/>
      <stop offset="100%" stop-color="#A27D33"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E4230"/>
      <stop offset="100%" stop-color="#072B1F"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="15" y="15" width="470" height="470" rx="90" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12"/>
  <rect x="25" y="25" width="450" height="450" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Shopping Cart Icon with Heart -->
  <g transform="translate(130, 75) scale(0.95)">
    <!-- Cart Line -->
    <path d="M 25 35 L 60 35 L 85 130 L 210 130 L 235 55 L 70 55" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Wheels -->
    <circle cx="105" cy="165" r="14" fill="url(#goldGrad)"/>
    <circle cx="190" cy="165" r="14" fill="url(#goldGrad)"/>

    <!-- Heart in Cart -->
    <path d="M 148 62 C 148 62 133 46 117 56 C 101 66 113 88 148 110 C 183 88 195 66 179 56 C 163 46 148 62 148 62 Z" fill="none" stroke="url(#goldGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <!-- AGAPE -->
  <text x="250" y="325" font-family="'Plus Jakarta Sans', 'Inter', 'Arial', sans-serif" font-weight="900" font-size="76" letter-spacing="3" fill="url(#goldGrad)" text-anchor="middle">AGAPE</text>

  <!-- e-MALL -->
  <text x="250" y="405" font-family="'Plus Jakarta Sans', 'Inter', 'Arial', sans-serif" font-weight="800" font-size="62" letter-spacing="2" fill="url(#goldGrad)" text-anchor="middle">e-MALL</text>
</svg>
